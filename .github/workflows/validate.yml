name: Validate courses

on:
  push:
    paths:
      - "public/courses/**"
      - "public/radio/**"
      - "public/assets/css/**"
      - "schema/**"
      - "scripts/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "public/courses/**"
      - "public/radio/**"
      - "public/assets/css/**"
      - "schema/**"
      - "scripts/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:radio
      - run: npm run validate:messages
      - run: npm run validate:css
      # The write endpoint validates against a version of the schema COMPILED
      # ahead of time (the Workers runtime forbids `new Function`). Regenerate
      # and diff: a schema edit that never reached the generated validator would
      # otherwise leave the wall checking last week's rules.
      - name: Check the generated validator matches the schema
        run: |
          npm run build:validator
          git diff --exit-code functions/api/_messages-validator.mjs functions/api/_messages-validator.d.mts
